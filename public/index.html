<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
<title>My DevOps Todo App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --olive-leaf: #606c38;
    --black-forest: #283618;
    --cornsilk: #fefae0;
    --sunlit-clay: #dda15e;
    --copperwood: #bc6c25;
  }

  body {
    min-height: 100vh;
    background: var(--cornsilk);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 30px 20px;
    color: var(--black-forest);
    overflow-x: hidden;
    position: relative;
  }

  /* Blob backgrounds */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.35;
    animation: blobFloat 8s ease-in-out infinite;
    z-index: 0; pointer-events: none;
  }
  .blob1 { width:500px;height:500px;background:radial-gradient(circle,#dda15e,#bc6c25);top:-100px;left:-100px;animation-delay:0s; }
  .blob2 { width:400px;height:400px;background:radial-gradient(circle,#606c38,#283618);top:30%;right:-80px;animation-delay:2s; }
  .blob3 { width:350px;height:350px;background:radial-gradient(circle,#dda15e,#606c38);bottom:-80px;left:30%;animation-delay:4s; }
  .blob4 { width:300px;height:300px;background:radial-gradient(circle,#bc6c25,#dda15e);top:60%;left:10%;animation-delay:1s; }

  @keyframes blobFloat {
    0%,100% { transform:translate(0,0) scale(1); }
    33% { transform:translate(20px,-20px) scale(1.05); }
    66% { transform:translate(-15px,15px) scale(0.95); }
  }

  .container { max-width:680px;margin:0 auto;position:relative;z-index:1; }

  /* Header */
  .header { text-align:center;padding:20px 0 28px; }
  .header-icon { font-size:3rem;display:block;margin-bottom:10px;animation:iconPulse 3s ease-in-out infinite; }
  @keyframes iconPulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.08);} }
  .header h1 {
    font-size:2.6rem;font-weight:900;
    background:linear-gradient(135deg, var(--black-forest), var(--olive-leaf), var(--copperwood));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;letter-spacing:-1px;margin-bottom:8px;
  }
  .header p { color:var(--olive-leaf);font-size:0.8rem;font-weight:600;letter-spacing:2px;text-transform:uppercase; }

  /* Glass */
  .glass {
    background: rgba(254,250,224,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(188,108,37,0.2);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(40,54,24,0.1);
  }

  /* Progress */
  .progress-section { padding:20px 22px;margin-bottom:14px; }
  .progress-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:12px; }
  .progress-label { font-size:0.72rem;font-weight:700;color:var(--olive-leaf);text-transform:uppercase;letter-spacing:2px; }
  .progress-percent {
    font-size:1.4rem;font-weight:900;
    background:linear-gradient(135deg, var(--copperwood), var(--olive-leaf));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .progress-bar-bg { width:100%;height:10px;background:rgba(96,108,56,0.15);border-radius:10px;overflow:hidden;margin-bottom:10px; }
  .progress-bar-fill {
    height:100%;border-radius:10px;
    background:linear-gradient(90deg, var(--olive-leaf), var(--sunlit-clay), var(--copperwood));
    transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
    position:relative;overflow:hidden;
  }
  .progress-bar-fill::after {
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);
    animation:shimmer 2s infinite;
  }
  @keyframes shimmer { 0%{transform:translateX(-100%);}100%{transform:translateX(100%);} }
  .progress-milestones { display:flex;gap:8px;flex-wrap:wrap; }
  .milestone {
    font-size:11px;font-weight:600;color:var(--olive-leaf);
    padding:3px 10px;border-radius:20px;
    background:rgba(96,108,56,0.1);border:1px solid rgba(96,108,56,0.2);transition:all 0.3s;
  }
  .milestone.achieved { background:rgba(96,108,56,0.2);color:var(--black-forest);border-color:var(--olive-leaf); }

  /* Stats */
  .stats-row { display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px; }
  .stat-card {
    padding:16px 10px;text-align:center;border-radius:18px;
    background:rgba(254,250,224,0.6);backdrop-filter:blur(20px);
    border:1.5px solid rgba(188,108,37,0.2);
    box-shadow:0 4px 16px rgba(40,54,24,0.08);transition:transform 0.2s;
  }
  .stat-card:hover { transform:translateY(-3px); }
  .stat-card .num { font-size:1.9rem;font-weight:900;line-height:1;margin-bottom:5px; }
  .stat-card .label { font-size:0.68rem;color:var(--olive-leaf);font-weight:600;text-transform:uppercase;letter-spacing:1px; }
  .stat-card.total .num { color:var(--black-forest); }
  .stat-card.done .num { color:var(--olive-leaf); }
  .stat-card.pending .num { color:var(--copperwood); }
  .stat-card.high .num { color:#c0392b; }

  /* Add section */
  .add-section { padding:22px;margin-bottom:14px; }
  .section-title { font-size:0.7rem;font-weight:700;color:var(--olive-leaf);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px; }
  .task-input-row { display:flex;gap:10px;margin-bottom:12px; }
  .task-input-row input {
    flex:1;padding:14px 18px;border-radius:14px;
    border:1.5px solid rgba(188,108,37,0.25);
    background:rgba(254,250,224,0.8);
    font-size:15px;color:var(--black-forest);outline:none;transition:all 0.3s;
  }
  .task-input-row input:focus {
    border-color:var(--copperwood);
    box-shadow:0 0 0 3px rgba(188,108,37,0.15);
  }
  .task-input-row input::placeholder { color:rgba(96,108,56,0.5); }

  .add-btn {
    padding:14px 22px;border-radius:14px;border:none;
    background:linear-gradient(135deg, var(--olive-leaf), var(--black-forest));
    color:var(--cornsilk);font-size:15px;font-weight:700;cursor:pointer;
    transition:all 0.25s;box-shadow:0 4px 20px rgba(40,54,24,0.25);white-space:nowrap;
  }
  .add-btn:hover { transform:translateY(-2px);box-shadow:0 6px 25px rgba(40,54,24,0.35); }

  .meta-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
  .meta-grid select,.meta-grid input[type="text"],.meta-grid input[type="date"] {
    padding:11px 14px;border-radius:12px;
    border:1.5px solid rgba(188,108,37,0.2);
    background:rgba(254,250,224,0.8);
    font-size:13px;color:var(--black-forest);outline:none;transition:all 0.3s;width:100%;
  }
  .meta-grid select:focus,.meta-grid input:focus { border-color:var(--copperwood); }
  .meta-grid select option { background:var(--cornsilk);color:var(--black-forest); }

  /* Todos */
  .todos-list { display:flex;flex-direction:column;gap:10px; }

  /* 3D Flip */
  .todo-flip-wrapper { perspective:1000px;min-height:80px; }
  .todo-flip-inner {
    position:relative;width:100%;
    transition:transform 0.6s cubic-bezier(0.4,0,0.2,1);
    transform-style:preserve-3d;
  }
  .todo-flip-wrapper.flipped .todo-flip-inner { transform:rotateY(180deg); }
  .todo-front,.todo-back { width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px; }
  .todo-back {
    position:absolute;top:0;left:0;transform:rotateY(180deg);
    background:linear-gradient(135deg,rgba(96,108,56,0.25),rgba(40,54,24,0.2));
    border:1.5px solid rgba(96,108,56,0.4);backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:center;min-height:80px;
    box-shadow:0 8px 32px rgba(96,108,56,0.15);
  }
  .todo-back-content { text-align:center;color:var(--olive-leaf);font-size:1.2rem;font-weight:800;padding:20px; }
  .todo-back-content span { font-size:2rem;display:block;margin-bottom:6px; }

  .todo-card {
    padding:18px 20px;display:flex;align-items:center;gap:16px;
    border-left:4px solid transparent;transition:all 0.25s;
    animation:fadeIn 0.3s ease;cursor:grab;
  }
  .todo-card:active { cursor:grabbing; }
  .todo-card.dragging { opacity:0.4;transform:scale(0.98); }
  .todo-card.drag-over { border-top:3px solid var(--copperwood);transform:translateY(3px); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);} }
  .todo-card:hover { transform:translateX(4px); }
  .todo-card.priority-high { border-left-color:#c0392b; }
  .todo-card.priority-medium { border-left-color:var(--copperwood); }
  .todo-card.priority-low { border-left-color:var(--olive-leaf); }
  .todo-card.done { opacity:0.5; }

  .checkbox {
    width:28px;height:28px;border-radius:50%;
    border:2px solid rgba(96,108,56,0.3);
    background:rgba(254,250,224,0.8);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:var(--olive-leaf);
    transition:all 0.2s;flex-shrink:0;
  }
  .checkbox.checked {
    background:linear-gradient(135deg,var(--olive-leaf),var(--black-forest));
    border-color:transparent;
    box-shadow:0 2px 12px rgba(96,108,56,0.4);color:var(--cornsilk);
  }

  .todo-content { flex:1;min-width:0; }
  .todo-text { font-size:15px;font-weight:600;color:var(--black-forest);margin-bottom:7px;word-break:break-word; }
  .todo-card.done .todo-text { text-decoration:line-through;color:rgba(40,54,24,0.4); }
  .todo-meta { display:flex;gap:6px;flex-wrap:wrap; }

  .badge { padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700; }
  .badge.high { background:rgba(192,57,43,0.12);color:#c0392b;border:1px solid rgba(192,57,43,0.25); }
  .badge.medium { background:rgba(188,108,37,0.12);color:var(--copperwood);border:1px solid rgba(188,108,37,0.25); }
  .badge.low { background:rgba(96,108,56,0.12);color:var(--olive-leaf);border:1px solid rgba(96,108,56,0.25); }
  .badge.category { background:rgba(40,54,24,0.1);color:var(--black-forest);border:1px solid rgba(40,54,24,0.2); }
  .badge.due { background:rgba(221,161,94,0.2);color:var(--copperwood);border:1px solid rgba(221,161,94,0.3); }
  .badge.overdue { background:rgba(192,57,43,0.12);color:#c0392b;border:1px solid rgba(192,57,43,0.25); }

  .delete-btn {
    width:34px;height:34px;border-radius:10px;
    border:1px solid rgba(192,57,43,0.2);background:rgba(192,57,43,0.08);
    color:#c0392b;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;
  }
  .delete-btn:hover { background:rgba(192,57,43,0.18);transform:scale(1.1); }

  .empty { text-align:center;padding:60px 0;color:var(--olive-leaf); }
  .empty span { font-size:4rem;display:block;margin-bottom:12px; }
  .empty p { font-size:1rem;font-weight:500; }

  /* Confetti */
  #confetti-canvas { position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999; }

  /* All done banner */
  .all-done-banner {
    display:none;padding:20px;margin-bottom:14px;text-align:center;
    background:linear-gradient(135deg,rgba(96,108,56,0.15),rgba(221,161,94,0.15));
    border:1.5px solid rgba(96,108,56,0.3);animation:fadeIn 0.5s ease;
  }
  .all-done-banner.show { display:block; }
  .all-done-banner h2 { font-size:1.4rem;font-weight:900;color:var(--black-forest);margin-bottom:4px; }
  .all-done-banner p { color:var(--olive-leaf);font-size:0.9rem; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<div class="container">

  <div class="header">
    <span class="header-icon">🌿</span>
    <h1>My DevOps Todo</h1>
    <p>Node.js • Docker • Kubernetes • Jenkins</p>
  </div>

  <div class="glass progress-section">
    <div class="progress-header">
      <span class="progress-label">📊 Overall Progress</span>
      <span class="progress-percent" id="progressPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-milestones">
      <span class="milestone" id="m25">🎯 25%</span>
      <span class="milestone" id="m50">🔥 50%</span>
      <span class="milestone" id="m75">⚡ 75%</span>
      <span class="milestone" id="m100">🏆 100%</span>
    </div>
  </div>

  <div class="glass all-done-banner" id="allDoneBanner">
    <h2>🏆 All Tasks Complete!</h2>
    <p>Incredible work! You crushed it today! 🎉</p>
  </div>

  <div class="stats-row">
    <div class="stat-card total"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
    <div class="stat-card done"><div class="num" id="doneCount">0</div><div class="label">Done</div></div>
    <div class="stat-card pending"><div class="num" id="pendingCount">0</div><div class="label">Pending</div></div>
    <div class="stat-card high"><div class="num" id="highCount">0</div><div class="label">High 🔴</div></div>
  </div>

  <div class="glass add-section">
    <div class="section-title">➕ Add New Task</div>
    <div class="task-input-row">
      <input type="text" id="todoInput" placeholder="What needs to be done?">
      <button class="add-btn" onclick="addTodo()">+ Add</button>
    </div>
    <div class="meta-grid">
      <select id="priorityInput">
        <option value="high">🔴 High Priority</option>
        <option value="medium" selected>🟡 Medium Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
      <input type="text" id="categoryInput" placeholder="📁 Category">
      <input type="date" id="dueDateInput">
      <select id="filterSelect" onchange="renderTodos()">
        <option value="all">📋 All Tasks</option>
        <option value="pending">⏳ Pending Only</option>
        <option value="done">✅ Done Only</option>
        <option value="high">🔴 High Priority</option>
      </select>
    </div>
  </div>

  <div class="todos-list" id="todoList"></div>
</div>

<script>
let allTodos = [];
let dragSrcId = null;
let prevAllDone = false;

// ── CONFETTI ──
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let confettiPieces = [];

function resizeCanvas() { canvas.width=window.innerWidth;canvas.height=window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function launchConfetti() {
  confettiPieces = [];
  for (let i=0;i<150;i++) {
    confettiPieces.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height-canvas.height,
      w:Math.random()*10+6, h:Math.random()*6+4,
      color:['#606c38','#283618','#dda15e','#bc6c25','#fefae0','#c0392b','#f39c12'][Math.floor(Math.random()*7)],
      rot:Math.random()*360, rotSpeed:(Math.random()-0.5)*6,
      vx:(Math.random()-0.5)*4, vy:Math.random()*4+2, opacity:1,
    });
  }
  animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiPieces.forEach(p => {
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotSpeed;
    if(p.y>canvas.height) p.opacity-=0.02;
    ctx.save();ctx.globalAlpha=Math.max(0,p.opacity);
    ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
    ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });
  confettiPieces=confettiPieces.filter(p=>p.opacity>0);
  if(confettiPieces.length>0) requestAnimationFrame(animateConfetti);
  else ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ── PROGRESS ──
function updateProgress(todos) {
  const total=todos.length, done=todos.filter(t=>t.done).length;
  const pct=total===0?0:Math.round((done/total)*100);
  document.getElementById('progressPercent').textContent=pct+'%';
  document.getElementById('progressBar').style.width=pct+'%';
  [['m25',25],['m50',50],['m75',75],['m100',100]].forEach(([id,t])=>{
    document.getElementById(id).classList.toggle('achieved',pct>=t);
  });
  const allDone=total>0&&done===total;
  document.getElementById('allDoneBanner').classList.toggle('show',allDone);
  if(allDone&&!prevAllDone) launchConfetti();
  prevAllDone=allDone;
}

// ── DRAG & DROP ──
function handleDragStart(e,id) {
  dragSrcId=id;e.dataTransfer.effectAllowed='move';
  setTimeout(()=>e.target.closest('.todo-flip-wrapper').querySelector('.todo-card').classList.add('dragging'),0);
}
function handleDragOver(e,id) {
  e.preventDefault();e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.todo-card').forEach(c=>c.classList.remove('drag-over'));
  if(dragSrcId!==id) e.target.closest('.todo-flip-wrapper')?.querySelector('.todo-card')?.classList.add('drag-over');
}
function handleDrop(e,id) {
  e.preventDefault();
  document.querySelectorAll('.todo-card').forEach(c=>{c.classList.remove('drag-over');c.classList.remove('dragging');});
  if(dragSrcId===id) return;
  const si=allTodos.findIndex(t=>t.id===dragSrcId), di=allTodos.findIndex(t=>t.id===id);
  const [moved]=allTodos.splice(si,1);allTodos.splice(di,0,moved);
  renderTodos();
}
function handleDragEnd() {
  document.querySelectorAll('.todo-card').forEach(c=>{c.classList.remove('drag-over');c.classList.remove('dragging');});
}

// ── RENDER ──
async function fetchTodos() {
  const res=await fetch('/api/todos');
  allTodos=await res.json();
  renderTodos();
}

function renderTodos() {
  const filter=document.getElementById('filterSelect').value;
  let todos=filter==='all'?[...allTodos]
    :filter==='pending'?allTodos.filter(t=>!t.done)
    :filter==='done'?allTodos.filter(t=>t.done)
    :allTodos.filter(t=>t.priority==='high');

  document.getElementById('totalCount').textContent=allTodos.length;
  document.getElementById('doneCount').textContent=allTodos.filter(t=>t.done).length;
  document.getElementById('pendingCount').textContent=allTodos.filter(t=>!t.done).length;
  document.getElementById('highCount').textContent=allTodos.filter(t=>t.priority==='high'&&!t.done).length;
  updateProgress(allTodos);

  const list=document.getElementById('todoList');
  if(todos.length===0) {
    list.innerHTML='<div class="glass empty"><span>🌱</span><p>No tasks yet! Add one above.</p></div>';
    return;
  }

  list.innerHTML='';
  todos.forEach(todo=>{
    const today=new Date().toISOString().split('T')[0];
    let dueBadge='';
    if(todo.dueDate) {
      const overdue=!todo.done&&todo.dueDate<today;
      dueBadge=`<span class="badge ${overdue?'overdue':'due'}">${overdue?'⚠️ Overdue':'📅'} ${todo.dueDate}</span>`;
    }
    const wrapper=document.createElement('div');
    wrapper.className=`todo-flip-wrapper ${todo.done?'flipped':''}`;
    wrapper.id=`wrapper-${todo.id}`;
    wrapper.innerHTML=`
      <div class="todo-flip-inner">
        <div class="todo-front glass todo-card priority-${todo.priority} ${todo.done?'done':''}"
          draggable="true"
          ondragstart="handleDragStart(event,${todo.id})"
          ondragover="handleDragOver(event,${todo.id})"
          ondrop="handleDrop(event,${todo.id})"
          ondragend="handleDragEnd()">
          <div class="checkbox ${todo.done?'checked':''}" onclick="toggleTodo(${todo.id},${!todo.done})">
            ${todo.done?'✓':''}
          </div>
          <div class="todo-content">
            <div class="todo-text">${todo.text}</div>
            <div class="todo-meta">
              <span class="badge ${todo.priority}">${todo.priority==='high'?'🔴 High':todo.priority==='medium'?'🟡 Medium':'🟢 Low'}</span>
              ${todo.category?`<span class="badge category">📁 ${todo.category}</span>`:''}
              ${dueBadge}
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTodo(${todo.id})">🗑</button>
        </div>
        <div class="todo-back">
          <div class="todo-back-content">
            <span>✅</span>
            Task Complete!
          </div>
        </div>
      </div>`;
    list.appendChild(wrapper);
  });
}

async function addTodo() {
  const text=document.getElementById('todoInput').value.trim();
  if(!text) return;
  await fetch('/api/todos',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      text,
      priority:document.getElementById('priorityInput').value,
      category:document.getElementById('categoryInput').value.trim()||'General',
      dueDate:document.getElementById('dueDateInput').value||null
    })
  });
  document.getElementById('todoInput').value='';
  document.getElementById('dueDateInput').value='';
  fetchTodos();
}

async function toggleTodo(id,done) {
  const wrapper=document.getElementById(`wrapper-${id}`);
  wrapper.classList.toggle('flipped',done);
  setTimeout(async()=>{
    await fetch(`/api/todos/${id}`,{
      method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({done})
    });
    fetchTodos();
  },300);
}

async function deleteTodo(id) {
  await fetch(`/api/todos/${id}`,{method:'DELETE'});
  fetchTodos();
}

document.getElementById('todoInput').addEventListener('keypress',e=>{
  if(e.key==='Enter') addTodo();
});

fetchTodos();
</script>
