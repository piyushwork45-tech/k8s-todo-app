<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My DevOps Todo App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 50%, #d4fc79 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 20px;
    color: #2d2d2d;
  }

  .container {
    max-width: 650px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    padding: 30px 0 24px;
  }

  .header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 20px rgba(0,0,0,0.15);
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .header p {
    color: rgba(255,255,255,0.8);
    font-size: 0.85rem;
    font-weight: 500;
  }

  .glass {
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(31,38,135,0.1);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-card {
    padding: 14px 10px;
    text-align: center;
    border-radius: 16px;
    background: rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  .stat-card .num {
    font-size: 1.8rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-card .label {
    font-size: 0.72rem;
    color: rgba(0,0,0,0.5);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-card.total .num { color: #6c63ff; }
  .stat-card.done .num { color: #00b894; }
  .stat-card.pending .num { color: #e17055; }
  .stat-card.high .num { color: #d63031; }

  .add-section {
    padding: 22px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: rgba(0,0,0,0.45);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .task-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .task-input-row input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.5);
    font-size: 15px;
    color: #2d2d2d;
    outline: none;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .task-input-row input:focus {
    border-color: #6c63ff;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }

  .task-input-row input::placeholder { color: rgba(0,0,0,0.35); }

  .add-btn {
    padding: 13px 22px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #6c63ff, #a855f7);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 4px 15px rgba(108,99,255,0.35);
    white-space: nowrap;
  }

  .add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108,99,255,0.5);
  }

  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .meta-grid select,
  .meta-grid input[type="text"],
  .meta-grid input[type="date"] {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.5);
    font-size: 13px;
    color: #2d2d2d;
    outline: none;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
    width: 100%;
  }

  .meta-grid select:focus,
  .meta-grid input:focus {
    border-color: #6c63ff;
    background: rgba(255,255,255,0.7);
  }

  .meta-grid select option { background: white; color: #2d2d2d; }

  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; }

  .filter-section {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    color: rgba(0,0,0,0.6);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active, .filter-btn:hover {
    background: rgba(255,255,255,0.6);
    border-color: rgba(108,99,255,0.4);
    color: #6c63ff;
    box-shadow: 0 2px 10px rgba(108,99,255,0.15);
  }

  .todos-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .todo-card {
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-left: 4px solid transparent;
    transition: all 0.25s;
    animation: fadeIn 0.3s ease;
    cursor: default;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .todo-card:hover { transform: translateX(3px); }

  .todo-card.priority-high { border-left-color: #d63031; }
  .todo-card.priority-medium { border-left-color: #6c63ff; }
  .todo-card.priority-low { border-left-color: #00b894; }
  .todo-card.done { opacity: 0.55; }

  .checkbox {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.2);
    background: rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .checkbox.checked {
    background: linear-gradient(135deg, #00b894, #00cec9);
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(0,184,148,0.4);
    color: white;
  }

  .todo-content { flex: 1; min-width: 0; }

  .todo-text {
    font-size: 15px;
    font-weight: 600;
    color: #2d2d2d;
    margin-bottom: 6px;
    word-break: break-word;
  }

  .todo-card.done .todo-text {
    text-decoration: line-through;
    color: rgba(0,0,0,0.35);
  }

  .todo-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .badge.high { background: rgba(214,48,49,0.12); color: #d63031; }
  .badge.medium { background: rgba(108,99,255,0.12); color: #6c63ff; }
  .badge.low { background: rgba(0,184,148,0.12); color: #00b894; }
  .badge.category { background: rgba(168,85,247,0.12); color: #a855f7; }
  .badge.due { background: rgba(253,203,110,0.2); color: #e17055; }
  .badge.overdue { background: rgba(214,48,49,0.15); color: #d63031; }

  .delete-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid rgba(214,48,49,0.2);
    background: rgba(214,48,49,0.08);
    color: #d63031;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: rgba(214,48,49,0.18);
    transform: scale(1.1);
  }

  .empty {
    text-align: center;
    padding: 50px 0;
    color: rgba(0,0,0,0.35);
  }

  .empty span { font-size: 3rem; display: block; margin-bottom: 10px; }
  .empty p { font-size: 1rem; font-weight: 500; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>✨ My DevOps Todo</h1>
    <p>Node.js • Docker • Kubernetes • Jenkins</p>
  </div>

  <div class="stats-row">
    <div class="stat-card total">
      <div class="num" id="totalCount">0</div>
      <div class="label">Total</div>
    </div>
    <div class="stat-card done">
      <div class="num" id="doneCount">0</div>
      <div class="label">Done</div>
    </div>
    <div class="stat-card pending">
      <div class="num" id="pendingCount">0</div>
      <div class="label">Pending</div>
    </div>
    <div class="stat-card high">
      <div class="num" id="highCount">0</div>
      <div class="label">🔴 High</div>
    </div>
  </div>

  <div class="glass add-section">
    <div class="section-title">Add New Task</div>
    <div class="task-input-row">
      <input type="text" id="todoInput" placeholder="What needs to be done?">
      <button class="add-btn" onclick="addTodo()">+ Add</button>
    </div>
    <div class="meta-grid">
      <select id="priorityInput">
        <option value="high">🔴 High Priority</option>
        <option value="medium" selected>🔵 Medium Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
      <input type="text" id="categoryInput" placeholder="📁 Category">
      <input type="date" id="dueDateInput">
      <select id="filterSelect" onchange="renderTodos()">
        <option value="all">📋 All Tasks</option>
        <option value="pending">⏳ Pending</option>
        <option value="done">✅ Done</option>
        <option value="high">🔴 High Priority</option>
      </select>
    </div>
  </div>

  <div class="todos-list" id="todoList"></div>

</div>

<script>
let allTodos = [];

async function fetchTodos() {
  const res = await fetch('/api/todos');
  allTodos = await res.json();
  renderTodos();
}

function renderTodos() {
  const filter = document.getElementById('filterSelect').value;
  let todos = [...allTodos];

  if (filter === 'pending') todos = todos.filter(t => !t.done);
  else if (filter === 'done') todos = todos.filter(t => t.done);
  else if (filter === 'high') todos = todos.filter(t => t.priority === 'high');

  todos.sort((a, b) => {
    const p = { high: 0, medium: 1, low: 2 };
    if (p[a.priority] !== p[b.priority]) return p[a.priority] - p[b.priority];
    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    return 0;
  });

  document.getElementById('totalCount').textContent = allTodos.length;
  document.getElementById('doneCount').textContent = allTodos.filter(t => t.done).length;
  document.getElementById('pendingCount').textContent = allTodos.filter(t => !t.done).length;
  document.getElementById('highCount').textContent = allTodos.filter(t => t.priority === 'high' && !t.done).length;

  const list = document.getElementById('todoList');

  if (todos.length === 0) {
    list.innerHTML = '<div class="glass empty"><span>🎯</span><p>No tasks here! Add one above.</p></div>';
    return;
  }

  list.innerHTML = '';
  todos.forEach(todo => {
    const card = document.createElement('div');
    card.className = `glass todo-card priority-${todo.priority} ${todo.done ? 'done' : ''}`;

    const today = new Date().toISOString().split('T')[0];
    let dueBadge = '';
    if (todo.dueDate) {
      const overdue = !todo.done && todo.dueDate < today;
      dueBadge = `<span class="badge ${overdue ? 'overdue' : 'due'}">
        ${overdue ? '⚠️ Overdue' : '📅'} ${todo.dueDate}
      </span>`;
    }

    card.innerHTML = `
      <div class="checkbox ${todo.done ? 'checked' : ''}" onclick="toggleTodo(${todo.id}, ${!todo.done})">
        ${todo.done ? '✓' : ''}
      </div>
      <div class="todo-content">
        <div class="todo-text">${todo.text}</div>
        <div class="todo-meta">
          <span class="badge ${todo.priority}">${
            todo.priority === 'high' ? '🔴 High' :
            todo.priority === 'medium' ? '🔵 Medium' : '🟢 Low'
          }</span>
          ${todo.category ? `<span class="badge category">📁 ${todo.category}</span>` : ''}
          ${dueBadge}
        </div>
      </div>
      <button class="delete-btn" onclick="deleteTodo(${todo.id})">🗑</button>
    `;
    list.appendChild(card);
  });
}

async function addTodo() {
  const text = document.getElementById('todoInput').value.trim();
  if (!text) return;
  await fetch('/api/todos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      text,
      priority: document.getElementById('priorityInput').value,
      category: document.getElementById('categoryInput').value.trim() || 'General',
      dueDate: document.getElementById('dueDateInput').value || null
    })
  });
  document.getElementById('todoInput').value = '';
  document.getElementById('dueDateInput').value = '';
  fetchTodos();
}

async function toggleTodo(id, done) {
  await fetch(`/api/todos/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done })
  });
  fetchTodos();
}

async function deleteTodo(id) {
  await fetch(`/api/todos/${id}`, { method: 'DELETE' });
  fetchTodos();
}

document.getElementById('todoInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') addTodo();
});

fetchTodos();
</script>
</body>
</html>
